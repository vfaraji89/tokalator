name: Bi-monthly Wiki Fetch

on:
  schedule:
    # 1st and 15th of every month at 06:00 UTC
    - cron: "0 6 1,15 * *"
  workflow_dispatch: # allow manual trigger

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Fetch arXiv papers and sources
        run: npm run fetch-wiki

      - name: Commit updated articles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/wiki/articles.json
          git diff --cached --quiet || git commit -m "chore: wiki fetch $(date +%Y-%m-%d)"
          git push
