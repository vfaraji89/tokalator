name: Refresh Pricing Catalog

on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run pricing agent
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: python scripts/fetch-pricing-agent.py

      - name: Regenerate modelProfiles.ts
        run: |
          cd tokalator-extension-vs
          npm ci
          npx tsx scripts/generate-models.ts

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tokalator-extension-vs/models.json tokalator-extension-vs/src/core/modelProfiles.ts
          git diff --cached --quiet || git commit -m "chore: refresh pricing catalog $(date +%Y-%m-%d)"
          git push
