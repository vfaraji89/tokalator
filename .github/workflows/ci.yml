name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tokalator-extension-vs
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tokalator-extension-vs/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tokalator-mcp
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tokalator-mcp/package-lock.json
      - run: npm ci
      - run: npm run build

  claude-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s claude-plugin/tests -v
