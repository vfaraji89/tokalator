name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Monthly, so dependency or runner drift shows up even when nothing is pushed.
  schedule:
    - cron: "23 4 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tokalator-extension-vs
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tokalator-extension-vs/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tokalator-mcp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tokalator-mcp/package-lock.json
      - run: npm ci
      - run: npm run build

  claude-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s claude-plugin/tests -v
